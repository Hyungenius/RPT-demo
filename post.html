<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>原帖详情 · 校招生体验</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <script src="mockData.js"></script>
  <script>
    (function () {
      const mock = window.RPTMock;
      const params = new URLSearchParams(window.location.search);
      const question = mock.getQuestionFromUrl();
      const isValid = question && question.status === "ready";
      const post = isValid ? mock.getPostById(question, params.get("postId")) : null;
      const commentId = params.get("commentId");

      const escapeHtml = (value) =>
        String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]);

      const formatCount = (value) => (value >= 1000 ? `${(value / 1000).toFixed(1)}k` : String(value));

      const backHref = isValid ? mock.buildDiandianUrl(question.id) : mock.buildSearchUrl(null);

      if (!isValid || !post) {
        document.body.innerHTML = `
          <div class="simple-page">
            <header class="simple-header">
              <a class="header-icon" href="${backHref}" aria-label="返回点点回复">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m15 18-6-6 6-6"/>
                </svg>
              </a>
              <h1 class="simple-title">原帖详情</h1>
            </header>
            <div class="simple-body">
              <div class="chat-fallback">
                <h1>未找到对应原帖</h1>
                <p>请回到点点回复页，重新点击评论气泡或引用角标。</p>
                <a class="fallback-link" href="index.html">返回搜索</a>
              </div>
            </div>
          </div>
        `;
        return;
      }

      document.title = `${post.title} · 校招生体验`;

      function renderNote(detail) {
        const comments = detail.comments || [];
        document.body.innerHTML = `
          <div class="note-page">
            <header class="note-header">
              <a class="header-icon" href="${backHref}" aria-label="返回点点回复">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m15 18-6-6 6-6"/>
                </svg>
              </a>
              <span class="note-author-avatar" style="background:${post.avatarColor}">${escapeHtml(post.avatar)}</span>
              <span class="note-author-name">${escapeHtml(post.author)}</span>
              <button class="follow-btn" type="button">关注</button>
              <span class="note-share" aria-hidden="true">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/>
                  <path d="M12 16V3"/>
                  <path d="m7 8 5-5 5 5"/>
                </svg>
              </span>
            </header>

            <div class="note-scroll">
              <div class="note-gallery">
                <div class="gallery-track" id="gallery-track">
                  ${detail.images.map((image, index) => `
                    <img src="${image}" alt="${escapeHtml(post.title)} 配图 ${index + 1}" loading="${index === 0 ? "eager" : "lazy"}">
                  `).join("")}
                </div>
                ${detail.galleryCount > 1 ? `<span class="gallery-index" id="gallery-index">1/${detail.galleryCount}</span>` : ""}
              </div>

              <article class="note-article">
                <h1 class="note-title">${escapeHtml(post.title)}</h1>
                ${detail.body.map((paragraph) => `<p class="note-paragraph">${escapeHtml(paragraph)}</p>`).join("")}
                <p class="note-tags">${detail.tags.map((tag) => escapeHtml(tag)).join(" ")}</p>
                <p class="note-publish-meta">${escapeHtml(detail.publishedAt)} · 本页为演示数据</p>
              </article>

              <section class="note-comments">
                <h2 class="note-comments-title">共 ${detail.stats.comments} 条评论</h2>
                <div class="comment-input-mock">有话要说，快来评论</div>

                ${comments.map((comment) => `
                  <article class="note-comment ${comment.id === commentId ? "highlight" : ""}" id="comment-${comment.id}">
                    <span class="note-comment-avatar" style="background:${comment.avatarColor}">${escapeHtml(comment.avatar)}</span>
                    <div class="note-comment-main">
                      <p class="note-comment-author">${escapeHtml(comment.author)}</p>
                      <p class="note-comment-text">${escapeHtml(comment.content)}</p>
                      <div class="note-comment-meta">
                        <span>${escapeHtml(comment.time)}</span>
                        <span>回复</span>
                        <span class="note-comment-like">
                          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                            <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>
                          </svg>
                          ${formatCount(comment.likes)}
                        </span>
                      </div>
                      ${comment.replies.length ? `
                        <div class="comment-replies">
                          ${comment.replies.map((reply) => `
                            <p class="comment-reply"><span class="reply-author">${escapeHtml(reply.author)}：</span>${escapeHtml(reply.content)}</p>
                          `).join("")}
                        </div>
                      ` : ""}
                    </div>
                  </article>
                `).join("")}
              </section>
            </div>

            <footer class="note-footer">
              <span class="note-footer-input">说点什么…</span>
              <span class="note-footer-stat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>
                </svg>
                ${formatCount(detail.stats.likes)}
              </span>
              <span class="note-footer-stat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m12 3 2.7 5.7 6.3.9-4.6 4.4 1.1 6.2L12 17.3 6.5 20.2l1.1-6.2L3 9.6l6.3-.9Z"/>
                </svg>
                ${formatCount(detail.stats.stars)}
              </span>
              <span class="note-footer-stat">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.8 9.8 0 0 1-3.4-.6L3 21l1.7-4.6a8.4 8.4 0 1 1 16.3-4.9Z"/>
                </svg>
                ${formatCount(detail.stats.comments)}
              </span>
            </footer>
          </div>
        `;

        const target = commentId ? document.getElementById(`comment-${commentId}`) : null;
        if (target) {
          target.scrollIntoView({ block: "center" });
        }

        const track = document.getElementById("gallery-track");
        const indexLabel = document.getElementById("gallery-index");
        if (track && indexLabel) {
          track.addEventListener("scroll", () => {
            const page = Math.round(track.scrollLeft / track.clientWidth) + 1;
            indexLabel.textContent = `${Math.min(page, detail.galleryCount)}/${detail.galleryCount}`;
          });
        }
      }

      function renderSimple() {
        const comments = mock.getCommentsByPost(question, post.id);
        document.body.innerHTML = `
          <div class="simple-page">
            <header class="simple-header">
              <a class="header-icon" href="${backHref}" aria-label="返回点点回复">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <path d="m15 18-6-6 6-6"/>
                </svg>
              </a>
              <h1 class="simple-title">原帖详情</h1>
            </header>

            <div class="simple-body">
              <div class="simple-card">
                <h2 class="simple-title" style="margin-bottom:8px;line-height:1.5">${escapeHtml(post.title)}</h2>
                <p class="page-note" style="margin-top:0">${escapeHtml(post.excerpt)}</p>
                <p class="page-note">作者：${escapeHtml(post.author)} · 原帖详情页内容待完善</p>

                <div style="margin-top:12px">
                  ${comments.map((comment) => `
                    <article class="simple-comment ${comment.id === commentId ? "highlight" : ""}" id="comment-${comment.id}">
                      <div class="simple-comment-head">
                        <span>${escapeHtml(comment.author)}</span>
                        <span>·</span>
                        <span>${comment.sentiment === "positive" ? "积极" : "消极"}</span>
                      </div>
                      <p class="simple-comment-text">${escapeHtml(comment.content)}</p>
                    </article>
                  `).join("")}
                </div>

                <div class="simple-actions">
                  <a class="simple-link" href="${backHref}">返回点点回复</a>
                  <a class="simple-link" href="${mock.buildCommentsUrl(question.id)}">查看全部评论</a>
                </div>
              </div>
            </div>
          </div>
        `;

        const target = commentId ? document.getElementById(`comment-${commentId}`) : null;
        if (target) {
          target.scrollIntoView({ block: "center" });
        }
      }

      if (post.detail) {
        renderNote(post.detail);
      } else {
        renderSimple();
      }
    })();
  </script>
</body>
</html>
