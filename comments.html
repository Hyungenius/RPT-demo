<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>大家怎么说 · 校招生体验</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body>
  <div class="simple-page">
    <header class="talk-header">
      <div class="talk-header-top">
        <a class="header-icon" id="back-link" href="index.html" aria-label="返回点点回复">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="m15 18-6-6 6-6"/>
          </svg>
        </a>
        <h1 class="talk-header-title">大家怎么说</h1>
      </div>
      <p class="talk-question" id="talk-question"></p>
    </header>

    <div class="talk-main" id="talk-main"></div>
  </div>

  <script src="mockData.js"></script>
  <script>
    (function () {
      const mock = window.RPTMock;
      const main = document.getElementById("talk-main");
      const questionText = document.getElementById("talk-question");
      const backLink = document.getElementById("back-link");
      const question = mock.getQuestionFromUrl();
      const rawQuestionId = new URLSearchParams(window.location.search).get("question");
      const isValid = question && question.status === "ready";

      backLink.href = isValid ? mock.buildDiandianUrl(question.id) : mock.buildSearchUrl(rawQuestionId);

      if (!isValid) {
        questionText.textContent = "";
        main.innerHTML = `
          <div class="chat-fallback">
            <h1>暂无评论数据</h1>
            <p>请先回到搜索页选择“校招生在小红书体验怎么样？”。</p>
            <a class="fallback-link" href="index.html">返回搜索</a>
          </div>
        `;
        return;
      }

      const escapeHtml = (value) =>
        String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"
        })[char]);

      const formatCount = (value) => (value >= 1000 ? `${(value / 1000).toFixed(1)}k` : String(value));

      const filters = [
        { key: "all", label: "全部" },
        { key: "positive", label: "积极" },
        { key: "negative", label: "消极" }
      ];
      let activeFilter = "all";

      questionText.textContent = question.label;

      function render() {
        const cards = mock.getCommentCards(question).sort((a, b) => b.likes - a.likes);
        const counts = {
          all: cards.length,
          positive: cards.filter((comment) => comment.sentiment === "positive").length,
          negative: cards.filter((comment) => comment.sentiment === "negative").length
        };
        const visible = activeFilter === "all" ? cards : cards.filter((comment) => comment.sentiment === activeFilter);

        main.innerHTML = `
          <p class="demo-note">本页为演示数据，评论及人物均为虚构。</p>

          <div class="filter-row" role="tablist" aria-label="评论观点筛选">
            ${filters.map((filter) => `
              <button
                class="filter-tab ${activeFilter === filter.key ? "active" : ""}"
                type="button"
                role="tab"
                aria-selected="${activeFilter === filter.key}"
                data-filter="${filter.key}"
              >
                ${filter.label}
                <span class="filter-count">${counts[filter.key]}</span>
              </button>
            `).join("")}
          </div>

          <div class="talk-list">
            ${visible.map((comment) => {
              const postUrl = mock.buildPostUrl(question.id, comment.postId, comment.id);
              return `
                <article class="talk-card">
                  <div class="talk-head">
                    <span class="talk-avatar" style="background:${comment.avatarColor}">${escapeHtml(comment.avatar)}</span>
                    <span class="talk-author">${escapeHtml(comment.author)}</span>
                    <span class="talk-post">${escapeHtml(comment.postTitle)}</span>
                    <a class="talk-origin" href="${postUrl}">查看原帖 ↗</a>
                  </div>
                  <a class="talk-content" href="${postUrl}" aria-label="查看该评论所在原帖">${escapeHtml(comment.content)}</a>
                  <div class="talk-stats">
                    <span class="talk-stat">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9.8 9.8 0 0 1-3.4-.6L3 21l1.7-4.6a8.4 8.4 0 1 1 16.3-4.9Z"/>
                      </svg>
                      ${formatCount(comment.replies)}
                    </span>
                    <span class="talk-stat">
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1.1-1.1a5.5 5.5 0 0 0-7.8 7.8l1.1 1.1L12 21l7.8-7.5 1.1-1.1a5.5 5.5 0 0 0-.1-7.8Z"/>
                      </svg>
                      ${formatCount(comment.likes)}
                    </span>
                  </div>
                </article>
              `;
            }).join("")}
          </div>
        `;
      }

      main.addEventListener("click", (event) => {
        const tab = event.target.closest(".filter-tab");
        if (!tab) return;
        activeFilter = tab.dataset.filter;
        render();
      });

      render();
    })();
  </script>
</body>
</html>
