<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>点点 · 校招生体验</title>
  <link rel="stylesheet" href="chat.css?v=20261113">
</head>
<body>
  <div class="chat-app">
    <header class="chat-header">
      <a class="header-icon" id="back-link" href="index.html" aria-label="返回搜索结果">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 18-6-6 6-6"/>
        </svg>
      </a>
      <h1 class="header-title">
        点点
        <svg class="header-spark" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M12 2c.6 5.6 4.4 9.4 10 10-5.6.6-9.4 4.4-10 10-.6-5.6-4.4-9.4-10-10 5.6-.6 9.4-4.4 10-10Z"/>
        </svg>
      </h1>
    </header>

    <div class="chat-scroll" id="chat-scroll"></div>

    <form class="chat-composer" id="composer">
      <input class="composer-input" id="composer-input" type="text" placeholder="继续问点点…" autocomplete="off" aria-label="输入问题">
      <button class="composer-send" type="submit">发送</button>
    </form>
  </div>

  <script src="mockData.js"></script>
  <script src="diandian.js"></script>
</body>
</html>
